<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <!-- Wall & Studio Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8f1e6" />
      <stop offset="65%" stop-color="#eedfc9" />
      <stop offset="66%" stop-color="#d4aa7d" />
      <stop offset="100%" stop-color="#b68555" />
    </linearGradient>

    <!-- TV Screen Backlight Glow -->
    <linearGradient id="tvScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14112e" />
      <stop offset="100%" stop-color="#1e1847" />
    </linearGradient>

    <!-- Sofa Olive Tone Gradients -->
    <linearGradient id="sofaBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#607659" />
      <stop offset="100%" stop-color="#465741" />
    </linearGradient>
    <linearGradient id="sofaCushion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#728c6a" />
      <stop offset="100%" stop-color="#55694f" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1a1a1a" flood-opacity="0.25" />
    </filter>
    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#1a1a1a" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Wall & Hardwood Floor -->
  <rect width="960" height="540" fill="url(#bgGrad)" />

  <!-- Hardwood Floor Planks lines -->
  <g stroke="#9b6c41" stroke-width="2" opacity="0.45">
    <line x1="120" y1="355" x2="80" y2="540" />
    <line x1="260" y1="355" x2="230" y2="540" />
    <line x1="400" y1="355" x2="390" y2="540" />
    <line x1="540" y1="355" x2="550" y2="540" />
    <line x1="680" y1="355" x2="710" y2="540" />
    <line x1="820" y1="355" x2="860" y2="540" />
  </g>
  <line x1="0" y1="355" x2="960" y2="355" stroke="#1a1a1a" stroke-width="3" />

  <!-- Left Window with Soft Daylight & Potted Plant -->
  <g transform="translate(45, 70)" filter="url(#crispShadow)">
    <rect width="70" height="160" fill="#fffcf4" stroke="#1a1a1a" stroke-width="3" rx="4" />
    <line x1="35" y1="0" x2="35" y2="160" stroke="#1a1a1a" stroke-width="2" />
    <line x1="0" y1="80" x2="70" y2="80" stroke="#1a1a1a" stroke-width="2" />
    <!-- Plant & Pot -->
    <rect x="18" y="170" width="34" height="34" fill="#d97a5b" stroke="#1a1a1a" stroke-width="2" rx="3" />
    <path d="M 35 170 C 15 140 10 115 35 125 C 60 115 55 140 35 170 Z" fill="#4d7c5f" stroke="#1a1a1a" stroke-width="2" />
  </g>

  <!-- Right Window with Soft Daylight & Potted Plant -->
  <g transform="translate(845, 70)" filter="url(#crispShadow)">
    <rect width="70" height="160" fill="#fffcf4" stroke="#1a1a1a" stroke-width="3" rx="4" />
    <line x1="35" y1="0" x2="35" y2="160" stroke="#1a1a1a" stroke-width="2" />
    <line x1="0" y1="80" x2="70" y2="80" stroke="#1a1a1a" stroke-width="2" />
    <!-- Plant & Pot -->
    <rect x="18" y="170" width="34" height="34" fill="#d97a5b" stroke="#1a1a1a" stroke-width="2" rx="3" />
    <path d="M 35 170 C 15 140 10 115 35 125 C 60 115 55 140 35 170 Z" fill="#4d7c5f" stroke="#1a1a1a" stroke-width="2" />
  </g>

  <!-- Wall-Mounted Big-Screen TV -->
  <g transform="translate(290, 40)" filter="url(#crispShadow)">
    <!-- TV Outer Bezel -->
    <rect width="380" height="210" fill="#141416" stroke="#1a1a1a" stroke-width="4" rx="6" />
    <!-- TV Screen -->
    <rect x="8" y="8" width="364" height="194" fill="url(#tvScreen)" rx="3" />

    <!-- TV Content: 8-Bit Pixel Game -->
    <!-- Top HUD -->
    <rect x="25" y="20" width="45" height="10" fill="#f43f5e" rx="2" />
    <rect x="300" y="20" width="45" height="10" fill="#fbbf24" rx="2" />
    <circle cx="182" cy="25" r="5" fill="#38bdf8" />

    <!-- Retro Invaders / Monsters -->
    <g fill="#4ade80">
      <rect x="110" y="50" width="22" height="15" rx="2" />
      <rect x="150" y="50" width="22" height="15" rx="2" />
      <rect x="190" y="50" width="22" height="15" rx="2" />
      <rect x="230" y="50" width="22" height="15" rx="2" />
    </g>
    <g fill="#f43f5e">
      <rect x="110" y="75" width="22" height="15" rx="2" />
      <rect x="150" y="75" width="22" height="15" rx="2" />
      <rect x="190" y="75" width="22" height="15" rx="2" />
      <rect x="230" y="75" width="22" height="15" rx="2" />
    </g>

    <!-- Floating Ice Platforms -->
    <rect x="30" y="125" width="100" height="14" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" rx="2" />
    <rect x="235" y="125" width="100" height="14" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" rx="2" />

    <!-- Ground Level in Game -->
    <rect x="8" y="180" width="364" height="22" fill="#22c55e" />
    <rect x="8" y="195" width="364" height="7" fill="#854d0e" />

    <!-- Mini Pixel Heroes on Screen -->
    <rect x="65" y="160" width="16" height="20" fill="#fbbf24" rx="2" />
    <rect x="175" y="155" width="16" height="25" fill="#f43f5e" rx="2" />
    <rect x="285" y="160" width="16" height="20" fill="#38bdf8" rx="2" />
  </g>

  <!-- TV Console Shelf Under TV -->
  <g transform="translate(390, 265)">
    <rect width="180" height="35" fill="#d4c3b0" stroke="#1a1a1a" stroke-width="2.5" rx="3" />
    <rect x="60" y="12" width="60" height="12" fill="#262626" rx="2" />
    <circle cx="110" cy="18" r="2" fill="#22c55e" />
  </g>

  <!-- Foreground Floor Shadows for Sofas -->
  <ellipse cx="230" cy="505" rx="110" ry="18" fill="#1a1a1a" opacity="0.15" />
  <ellipse cx="480" cy="515" rx="170" ry="22" fill="#1a1a1a" opacity="0.18" />
  <ellipse cx="730" cy="505" rx="110" ry="18" fill="#1a1a1a" opacity="0.15" />

  <!-- LEFT ARMCHAIR (Angled Inward) -->
  <g transform="translate(140, 360) rotate(8)" filter="url(#crispShadow)">
    <rect width="140" height="135" fill="url(#sofaBody)" stroke="#1a1a1a" stroke-width="3" rx="10" />
    <rect x="15" y="25" width="110" height="85" fill="url(#sofaCushion)" stroke="#1a1a1a" stroke-width="2.5" rx="8" />
  </g>

  <!-- RIGHT ARMCHAIR (Angled Inward) -->
  <g transform="translate(680, 360) rotate(-8)" filter="url(#crispShadow)">
    <rect width="140" height="135" fill="url(#sofaBody)" stroke="#1a1a1a" stroke-width="3" rx="10" />
    <rect x="15" y="25" width="110" height="85" fill="url(#sofaCushion)" stroke="#1a1a1a" stroke-width="2.5" rx="8" />
  </g>

  <!-- CENTER TWO-SEATER SOFA -->
  <g transform="translate(325, 365)" filter="url(#crispShadow)">
    <rect width="310" height="145" fill="url(#sofaBody)" stroke="#1a1a1a" stroke-width="3.5" rx="12" />
    <line x1="155" y1="20" x2="155" y2="145" stroke="#1a1a1a" stroke-width="2.5" />
    <rect x="20" y="30" width="125" height="90" fill="url(#sofaCushion)" stroke="#1a1a1a" stroke-width="2" rx="8" />
    <rect x="165" y="30" width="125" height="90" fill="url(#sofaCushion)" stroke="#1a1a1a" stroke-width="2" rx="8" />
  </g>

  <!-- FOUR PLAYERS SEATED (Viewed from Behind, Facing TV, Holding Smartphone Controllers) -->

  <!-- Player 1 (Left Armchair - Ginger Hair, Brown Knit Sweater) -->
  <g transform="translate(170, 305)">
    <!-- Body Back -->
    <path d="M 20 70 Q 55 60 90 70 L 95 125 L 15 125 Z" fill="#9c6644" stroke="#1a1a1a" stroke-width="2.5" />
    <!-- Low-Poly Head & Auburn Hair -->
    <polygon points="55,10 75,25 78,55 55,65 32,55 35,25" fill="#d97706" stroke="#1a1a1a" stroke-width="2.5" />
    <polygon points="55,10 40,25 55,35 70,25" fill="#f59e0b" stroke="#1a1a1a" stroke-width="1.5" />
    <!-- Hands holding Smartphone Gamepad -->
    <rect x="90" y="65" width="38" height="24" rx="4" fill="#1e293b" stroke="#1a1a1a" stroke-width="2" transform="rotate(-15 90 65)" />
    <!-- Gamepad glowing D-pad -->
    <circle cx="100" cy="74" r="3" fill="#22c55e" />
    <circle cx="114" cy="70" r="2.5" fill="#eab308" />
  </g>

  <!-- Player 2 (Left Sofa Seat - Brown Hair, Cyan/Teal Sweater) -->
  <g transform="translate(370, 345)">
    <!-- Body Back -->
    <path d="M 15 60 Q 45 50 75 60 L 80 115 L 10 115 Z" fill="#0d9488" stroke="#1a1a1a" stroke-width="2.5" />
    <!-- Head & Hair -->
    <polygon points="45,15 65,28 66,54 45,62 24,54 25,28" fill="#b45309" stroke="#1a1a1a" stroke-width="2.5" />
    <!-- Hands holding Gamepad -->
    <rect x="30" y="70" width="32" height="18" rx="3" fill="#1e293b" stroke="#1a1a1a" stroke-width="2" />
    <circle cx="38" cy="79" r="2.5" fill="#38bdf8" />
    <circle cx="54" cy="79" r="2.5" fill="#f43f5e" />
  </g>

  <!-- Player 3 (Right Sofa Seat - Lavender/Grey Hair, Cream/Oatmeal Sweater) -->
  <g transform="translate(515, 345)">
    <!-- Body Back -->
    <path d="M 15 60 Q 45 50 75 60 L 80 115 L 10 115 Z" fill="#e2d6c5" stroke="#1a1a1a" stroke-width="2.5" />
    <!-- Head & Hair -->
    <polygon points="45,15 65,28 66,54 45,62 24,54 25,28" fill="#64748b" stroke="#1a1a1a" stroke-width="2.5" />
    <!-- Hands holding Gamepad -->
    <rect x="28" y="70" width="32" height="18" rx="3" fill="#1e293b" stroke="#1a1a1a" stroke-width="2" />
    <circle cx="36" cy="79" r="2.5" fill="#a855f7" />
    <circle cx="52" cy="79" r="2.5" fill="#22c55e" />
  </g>

  <!-- Player 4 (Right Armchair - Brown Hair, Sage/Grey Sweater) -->
  <g transform="translate(685, 305)">
    <!-- Body Back -->
    <path d="M 20 70 Q 55 60 90 70 L 95 125 L 15 125 Z" fill="#6b7280" stroke="#1a1a1a" stroke-width="2.5" />
    <!-- Head & Hair -->
    <polygon points="55,10 75,25 78,55 55,65 32,55 35,25" fill="#78350f" stroke="#1a1a1a" stroke-width="2.5" />
    <!-- Hands holding Gamepad -->
    <rect x="-8" y="75" width="38" height="24" rx="4" fill="#1e293b" stroke="#1a1a1a" stroke-width="2" transform="rotate(15 -8 75)" />
    <circle cx="2" cy="85" r="3" fill="#22c55e" />
    <circle cx="16" cy="88" r="2.5" fill="#fbbf24" />
  </g>
</svg>
