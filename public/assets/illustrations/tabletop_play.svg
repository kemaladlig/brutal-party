<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <!-- Warm Cream Background Gradient -->
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="100%" stop-color="#f1e6d4" />
    </linearGradient>

    <!-- Wooden Table Top Texture -->
    <linearGradient id="woodTable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9925e" />
      <stop offset="50%" stop-color="#b67e4b" />
      <stop offset="100%" stop-color="#9a6434" />
    </linearGradient>
    <linearGradient id="woodTableSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4b21" />
      <stop offset="100%" stop-color="#5a3414" />
    </linearGradient>

    <!-- Tablet Screen Glow -->
    <linearGradient id="tabletScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="tableShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="16" stdDeviation="12" flood-color="#1a1a1a" flood-opacity="0.28" />
    </filter>
    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#1a1a1a" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Studio Warm Background -->
  <rect width="960" height="540" fill="url(#warmBg)" />

  <!-- Isometric Floor Rug (Checkered Pattern) -->
  <g transform="translate(180, 160)" opacity="0.85">
    <polygon points="300,40 580,180 300,320 20,180" fill="#e8ded1" stroke="#1a1a1a" stroke-width="2" />
    <!-- Checkered Diamond Grid Lines -->
    <path d="M 160,110 L 440,250 M 90,145 L 370,285 M 230,75 L 510,215" stroke="#d5c4b1" stroke-width="2" />
    <path d="M 440,110 L 160,250 M 510,145 L 230,285 M 370,75 L 90,215" stroke="#d5c4b1" stroke-width="2" />
  </g>

  <!-- LOW-PROFILE WOODEN COFFEE TABLE (Isometric) -->
  <!-- Floor shadow under table legs -->
  <ellipse cx="480" cy="420" rx="220" ry="60" fill="#1a1a1a" opacity="0.22" />

  <!-- Table Legs -->
  <!-- Back Leg -->
  <polygon points="460,280 475,280 475,340 460,340" fill="#5a3414" stroke="#1a1a1a" stroke-width="2" />
  <!-- Left Leg -->
  <polygon points="300,320 325,320 325,410 300,400" fill="#7a4b21" stroke="#1a1a1a" stroke-width="2.5" />
  <!-- Right Leg -->
  <polygon points="635,320 660,320 660,400 635,410" fill="#5a3414" stroke="#1a1a1a" stroke-width="2.5" />
  <!-- Front Center Leg -->
  <polygon points="465,370 495,370 495,445 465,445" fill="#7a4b21" stroke="#1a1a1a" stroke-width="2.5" />

  <!-- Table Top Thickness (Side Apron) -->
  <polygon points="260,280 480,370 480,395 260,305" fill="url(#woodTableSide)" stroke="#1a1a1a" stroke-width="3" />
  <polygon points="480,370 700,280 700,305 480,395" fill="#522e0f" stroke="#1a1a1a" stroke-width="3" />

  <!-- Table Top Surface -->
  <polygon points="480,185 700,280 480,370 260,280" fill="url(#woodTable)" stroke="#1a1a1a" stroke-width="3.5" />

  <!-- LARGE TABLET COMPUTER (Lying Flat in Center of Table) -->
  <!-- Tablet Outer Bezel (White/Silver Frame) -->
  <polygon points="480,225 615,280 480,335 345,280" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" />
  <!-- Tablet Active Screen -->
  <polygon points="480,233 603,280 480,327 357,280" fill="url(#tabletScreen)" stroke="#1a1a1a" stroke-width="1.5" />

  <!-- 3D Pastel Isometric Cubes / Game on Tablet Screen -->
  <g transform="translate(480, 280)">
    <!-- Central Cube Cluster (Pinks, Yellows, Cyans, Greens) -->
    <!-- Cube 1 (Pink) -->
    <polygon points="0,-16 18,-7 0,2 -18,-7" fill="#f472b6" stroke="#1a1a1a" stroke-width="1" />
    <polygon points="-18,-7 0,2 0,14 -18,5" fill="#db2777" stroke="#1a1a1a" stroke-width="1" />
    <polygon points="0,2 18,-7 18,5 0,14" fill="#be185d" stroke="#1a1a1a" stroke-width="1" />

    <!-- Cube 2 (Yellow) -->
    <polygon points="20,-6 38,3 20,12 2,3" fill="#fde047" stroke="#1a1a1a" stroke-width="1" />
    <polygon points="2,3 20,12 20,24 2,15" fill="#eab308" stroke="#1a1a1a" stroke-width="1" />
    <polygon points="20,12 38,3 38,15 20,24" fill="#ca8a04" stroke="#1a1a1a" stroke-width="1" />

    <!-- Cube 3 (Cyan/Green) -->
    <polygon points="-20,-6 -2,3 -20,12 -38,3" fill="#67e8f9" stroke="#1a1a1a" stroke-width="1" />
    <polygon points="-38,3 -20,12 -20,24 -38,15" fill="#06b6d4" stroke="#1a1a1a" stroke-width="1" />
    <polygon points="-20,12 -2,3 -2,15 -20,24" fill="#0891b2" stroke="#1a1a1a" stroke-width="1" />

    <!-- 4 Corner Touch Control Zones on Tablet -->
    <!-- P1 Sol-Üst -->
    <polygon points="-90,-25 -70,-15 -85,-7 -105,-17" fill="#38bdf8" stroke="#1a1a1a" stroke-width="1" rx="2" />
    <!-- P2 Sağ-Üst -->
    <polygon points="90,-25 105,-17 85,-7 70,-15" fill="#f43f5e" stroke="#1a1a1a" stroke-width="1" rx="2" />
    <!-- P3 Sol-Alt -->
    <polygon points="-90,25 -105,17 -85,7 -70,15" fill="#22c55e" stroke="#1a1a1a" stroke-width="1" rx="2" />
    <!-- P4 Sağ-Alt -->
    <polygon points="90,25 70,15 85,7 105,17" fill="#fbbf24" stroke="#1a1a1a" stroke-width="1" rx="2" />
  </g>

  <!-- FOUR FRIENDS GATHERED AROUND TABLE (Touching Tablet) -->

  <!-- Top-Left Friend (Ginger Low-Poly Hair, Teal Sweater) -->
  <g transform="translate(300, 100)">
    <!-- Body & Arms leaning onto table -->
    <polygon points="70,100 120,80 150,140 85,160" fill="#0d9488" stroke="#1a1a1a" stroke-width="2.5" />
    <!-- Arm extending to tablet -->
    <path d="M 125,120 L 160,165" stroke="#0d9488" stroke-width="24" stroke-linecap="round" />
    <path d="M 160,165 L 180,185" stroke="#fed7aa" stroke-width="14" stroke-linecap="round" />
    <!-- Head & Hair (Low-Poly 3D) -->
    <polygon points="80,30 115,20 135,50 120,85 85,85 65,55" fill="#ea580c" stroke="#1a1a1a" stroke-width="2.5" />
    <polygon points="80,30 100,50 115,20" fill="#f97316" stroke="#1a1a1a" stroke-width="1.5" />
    <polygon points="85,85 100,50 120,85" fill="#c2410c" stroke="#1a1a1a" stroke-width="1.5" />
  </g>

  <!-- Top-Right Friend (Grey/Lavender Hair, Magenta/Purple Sweater) -->
  <g transform="translate(520, 100)">
    <!-- Body & Arms -->
    <polygon points="90,80 140,100 125,160 60,140" fill="#9333ea" stroke="#1a1a1a" stroke-width="2.5" />
    <!-- Arm extending to tablet -->
    <path d="M 85,120 L 50,165" stroke="#9333ea" stroke-width="24" stroke-linecap="round" />
    <path d="M 50,165 L 30,185" stroke="#fed7aa" stroke-width="14" stroke-linecap="round" />
    <!-- Head & Hair -->
    <polygon points="130,30 145,55 125,85 90,85 75,50 95,20" fill="#64748b" stroke="#1a1a1a" stroke-width="2.5" />
    <polygon points="95,20 110,50 130,30" fill="#94a3b8" stroke="#1a1a1a" stroke-width="1.5" />
    <polygon points="90,85 110,50 125,85" fill="#475569" stroke="#1a1a1a" stroke-width="1.5" />
  </g>

  <!-- Bottom-Left Friend (Orange Knit Sweater, Facing Away, Touching Tablet) -->
  <g transform="translate(260, 270)">
    <!-- Pants & Seated Body -->
    <ellipse cx="70" cy="190" rx="45" ry="18" fill="#475569" stroke="#1a1a1a" stroke-width="2.5" />
    <!-- Torso Back -->
    <polygon points="40,120 100,120 115,190 25,190" fill="#f97316" stroke="#1a1a1a" stroke-width="3" />
    <!-- Arm reaching up to tablet -->
    <path d="M 85,135 L 140,105" stroke="#f97316" stroke-width="24" stroke-linecap="round" />
    <path d="M 140,105 L 165,95" stroke="#fed7aa" stroke-width="14" stroke-linecap="round" />
    <!-- Head & Hair (Low Poly) -->
    <polygon points="70,50 100,65 95,115 45,115 40,65" fill="#c2410c" stroke="#1a1a1a" stroke-width="2.5" />
    <polygon points="70,50 85,85 100,65" fill="#ea580c" stroke="#1a1a1a" stroke-width="1.5" />
    <polygon points="45,115 85,85 95,115" fill="#9a3412" stroke="#1a1a1a" stroke-width="1.5" />
  </g>

  <!-- Bottom-Right Friend (Navy/Grey Sweater, Facing Away, Touching Tablet) -->
  <g transform="translate(540, 270)">
    <!-- Pants & Seated Body -->
    <ellipse cx="90" cy="190" rx="45" ry="18" fill="#334155" stroke="#1a1a1a" stroke-width="2.5" />
    <!-- Torso Back -->
    <polygon points="60,120 120,120 135,190 45,190" fill="#3b82f6" stroke="#1a1a1a" stroke-width="3" />
    <!-- Arm reaching up to tablet -->
    <path d="M 75,135 L 20,105" stroke="#3b82f6" stroke-width="24" stroke-linecap="round" />
    <path d="M 20,105 L -5,95" stroke="#fed7aa" stroke-width="14" stroke-linecap="round" />
    <!-- Head & Hair -->
    <polygon points="90,50 120,65 115,115 65,115 60,65" fill="#57534e" stroke="#1a1a1a" stroke-width="2.5" />
    <polygon points="90,50 105,85 120,65" fill="#78716c" stroke="#1a1a1a" stroke-width="1.5" />
    <polygon points="65,115 105,85 115,115" fill="#44403c" stroke="#1a1a1a" stroke-width="1.5" />
  </g>
</svg>
