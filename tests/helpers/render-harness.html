<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Render harness</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; background: #E8E6DF; color: #1A1A1A;
    font: 12px/1.4 ui-monospace, monospace;
  }
  .row { padding: 10px 12px 0; }
  .row h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  canvas { display: block; background: #F4F4F0; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .meta { padding: 2px 12px; opacity: .65; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
// Görsel doğrulama harness'ı — geliştirme aracı, build'e girmez.
//
// Motoru herhangi bir boyutta GERÇEK bir canvas'a çizer. Amaç: `innerWidth`/
// `innerHeight` viewport'a bağlı olduğu için telefon yatay (844x390) bileşimini
// tarayıcı penceresi ayarlanmadan görebilmek. Bu yüzden `isCompactLandscape`
// ve `getDisplayProfile` yönlendirmeleri burada ölçülere bağlanır.
//
// Kullanım: /tests/helpers/render-harness.html?game=ARCHER&w=844&h=390&t=2500
//         &cells=1     -> aynı oyunu 3 boyutta yan yana çiz
//         &notch=47    -> güvenli alan kenar boşluğu simülasyonu (px)
//         &match=0     -> 1: lobi yerine oynanış (default), 0: lobi

const params = new URLSearchParams(location.search);
const num = (key, fallback) => (params.has(key) ? Number(params.get(key)) : fallback);
const NOTCH = num('notch', 0);

// Görünürlük: `isCompactLandscape` ve profil seçimi bunları okur. Probe
// dalları da aynı yardımcıya ihtiyaç duyar, bu yüzden dalın ÖNÜNDE durur
// (else bloğu çalışmadığında blok içi fonksiyon erişilemez).
function pinViewport(w, h) {
  for (const [k, v] of [['innerWidth', w], ['innerHeight', h]]) {
    Object.defineProperty(window, k, { value: w === undefined ? 0 : v, configurable: true, writable: true });
  }
  if (NOTCH > 0 && window.getComputedStyle) {
    const real = window.getComputedStyle.bind(window);
    window.getComputedStyle = (el, pseudo) => {
      const s = real(el, pseudo);
      if (s && typeof s.getPropertyValue === 'function') {
        const raw = s.getPropertyValue.bind(s);
        s.getPropertyValue = (name) => {
          // env(safe-area-inset-*) tarayıcıda hep 0 döner; testte ölçülemezse
          // güvenli alan hiç doğrulanamaz. Notch'u yatayda simüle et.
          if (name === 'padding-top' || name === 'padding-bottom') {
            return `${NOTCH}px`;
          }
          return raw(name);
        };
      }
      return s;
    };
  }
}

// --- probe: tek varlığın ÇİZİLEN yayılımını ölç ------------------------------
// Çarpışma yarıçapı ile çizilen boyut AYNI şey değil. Oyun içi avatar
// (faceMode 'play') dekor katmanı taşımıyor ama gözler büyütüldü ve disk içi
// hacim eklendi; "göz büyümesi silueti taşırdı mı" sorusunun sayısal cevabı
// buradan gelir. Kullanım: ?probe=extent&r=16
if (params.get('probe') === 'zoom') {
  // Gerçek sayfayı iframe içinde 2.2x büyüt: 104px'lik profil kartı kutusu
  // piksel düzeyinde incelenebilir olur. Aynı origin (aynı port) olduğu için
  // iframe erişilebilir.
  const frame = document.createElement('iframe');
  frame.src = '/?probe-zoom=1';
  frame.width = '760';
  frame.height = '2600';
  frame.style.cssText = `width:760px;height:2600px;border:0;transform:scale(${num('z', 2.2)});transform-origin:top left`;
  out.appendChild(frame);
  document.title = 'probe zoom';
} else if (['extent', 'face', 'card', 'sparks'].includes(params.get('probe'))) {
  const R = num('r', 16);
  const size = Math.ceil(R * 8);
  const results = [];

  const measure = async (label, draw) => {
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const g = c.getContext('2d');
    g.translate(size / 2, size / 2);
    draw(g);
    const d = g.getImageData(0, 0, size, size).data;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (let y = 0; y < size; y += 1) {
      for (let x = 0; x < size; x += 1) {
        if (d[(y * size + x) * 4 + 3] === 0) continue;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
    results.push({
      label,
      radiusArg: R,
      drawnWidth: maxX - minX + 1,
      drawnHeight: maxY - minY + 1,
      ratioToDiameter: +(((maxX - minX + 1) / (R * 2))).toFixed(2),
    });
  };

  const { drawGameAvatar } = await import('../../src/core/avatarInGame.js');
  const { drawBrutalAvatar } = await import('../../src/ui/characterRenderer.js');
  const avatar = (extra = {}) => ({
    index: 0, name: 'P1', color: '#D84727', expression: 'FOCUS', ...extra,
  });
  const noise = { label: '', showPointer: false };

  // Oyun içi yüz: her ifade + bakış açısı. Hepsi aynı gövde sınırında kalmalı.
  for (const expression of ['FOCUS', 'ANGRY', 'WINK', 'DERP', 'CYCLOPS', 'HEART', 'GRIN', 'SHADES']) {
    await measure(`play/${expression}`, (g) => {
      drawGameAvatar(g, 0, 0, R, avatar({ expression }), { ...noise, expression });
    });
  }
  await measure('play/look+PI/2', (g) => {
    drawGameAvatar(g, 0, 0, R, avatar(), { ...noise, lookAngle: Math.PI / 2 });
  });
  await measure('play/blink', (g) => {
    drawGameAvatar(g, 0, 0, R, avatar(), { ...noise, isBlinking: true });
  });
  // Menü yüzü: aynı yuvarlak gövde, hacim yok. Eski dekor id'leri verilse de
  // (kalıcı profilden sızabilir) ÇİZİLMEZLER — iki satır birebir aynı ölçülmeli.
  await measure('menu/plain', (g) => {
    drawBrutalAvatar(g, 0, 0, R, {
      color: '#D84727', slotIndex: 0, expression: 'FOCUS', ...noise,
    });
  });
  await measure('menu/legacy-ids(ignored)', (g) => {
    drawBrutalAvatar(g, 0, 0, R, {
      color: '#D84727', slotIndex: 0, expression: 'FOCUS',
      accessory: 'MINI_CROWN', pattern: 'RIBBON', ...noise,
    });
  });
  await measure('hordeEnemy/chaser', (g) => {
    g.fillStyle = '#E63946';
    g.beginPath();
    g.arc(0, 0, R, 0, Math.PI * 2);
    g.fill();
  });

  const pre = document.createElement('pre');
  pre.style.padding = '12px';
  pre.textContent = JSON.stringify(results, null, 1);
  out.appendChild(pre);
  document.title = 'probe extent';

  // `card` probu: profil kartı / atölye sahnesinin GERÇEK kod yolu
  // (`syncStageCanvas` + `drawAvatarStage`) — kutu boyutu verilip 1:1 çizilir.
  // Amaç: çizim kodunu CSS'ten ayırmak. Not: eski sabit yarıçaplı kart, bitmap'i
  // 192px tutup CSS kutusuna 98px'e küçültüyordu; gövde kutunun %46'sını
  // kaplıyor, karakter küçük ve boşluklu görünüyordu.
  if (params.get('probe') === 'card') {
    const { syncStageCanvas, drawAvatarStage } = await import('../../src/ui/avatarStage.js');
    // Aynı çizim, üç farklı bitmap/CSS oranı: 1:1, 2:1 (büyük bitmap küçük
    // kutuya sığdırılır — kartın ESKİ hali), 1:2 (küçük bitmap büyük kutuya
    // büyütülür). Oran 1:1'de temiz, diğerlerinde bozulma varsa suç
    // çizimde değil bitmap ölçeklemesindedir.
    const ratios = [[1, 1], [220, 90], [90, 180]];
    for (const [bitmap, css] of ratios) {
      const c = document.createElement('canvas');
      c.width = bitmap;
      c.height = bitmap;
      c.style.width = `${css}px`;
      c.style.height = `${css}px`;
      c.style.background = '#F4F4F0';
      c.style.border = '2px solid #D84727';
      out.appendChild(c);
      const g = c.getContext('2d');
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.clearRect(0, 0, bitmap, bitmap);
      drawAvatarStage(g, bitmap, bitmap, Math.round(bitmap * 0.37), {
        color: '#2F6A4F', expression: num('e', 'HEART'), facingAngle: num('a', 0.4),
      });
      const cap = document.createElement('div');
      cap.style.cssText = 'padding:4px 12px;font:12px ui-monospace,monospace';
      cap.textContent = `bitmap ${bitmap}px → CSS ${css}px (ölçek ${(css / bitmap).toFixed(2)}x)`;
      out.appendChild(cap);
    }
  }

  // `face` probu: göz/kırpma/nişan şeridi — r=6/10/16/28'de okunabilirlik.
  if (params.get('probe') === 'face') {
    const { blinkState } = await import('../../src/core/avatarInGame.js');
    const strip = document.createElement('div');
    strip.style.padding = '12px';
    const row = document.createElement('canvas');
    const radii = [6, 10, 16, 28];
    row.width = radii.length * 160;
    row.height = 220;
    const g = row.getContext('2d');
    g.fillStyle = '#F4F4F0';
    g.fillRect(0, 0, row.width, row.height);
    const now = num('t', 0);
    const stripCases = [
      { label: 'focus', opts: {} },
      { label: 'blink', opts: { isBlinking: blinkState(now + 40, 0) === 1 } },
      { label: 'look', opts: { lookAngle: Math.PI / 2 } },
      { label: 'angry', opts: { expression: 'ANGRY' } },
    ];
    radii.forEach((rad, i) => {
      const cx = 80 + i * 160;
      stripCases.forEach((testCase, j) => {
        g.save();
        g.translate(cx, 60 + j * 40);
        drawGameAvatar(g, 0, 0, rad, avatar(), { ...noise, ...testCase.opts });
        g.restore();
        g.fillStyle = '#1A1A1A';
        g.font = '10px ui-monospace, monospace';
        g.textAlign = 'center';
        g.fillText(`r=${rad} ${testCase.label}`, cx, 215);
      });
    });
    strip.appendChild(row);
    out.appendChild(strip);
  }

  // `sparks` probu: dokunma patlamasının merkezi avatar merkezinde mi?
  // Gerçek kod yolu (`spawnBoingSparks` + `stepSparks` + `drawSparks`) tohumlu
  // rastgelelikle çalıştırılır, t=0.30sn'ye ilerletilir; sonra avatar diski
  // (1.18r) ve zemin gölgesi dışındaki piksellerin ağırlık merkezi, doğuş
  // merkeziyle karşılaştırılır. Kullanım: ?probe=sparks
  if (params.get('probe') === 'sparks') {
    const { syncStageCanvas, drawAvatarStage, spawnBoingSparks, stepSparks, drawSparks } =
      await import('../../src/ui/avatarStage.js');
    // Deterministik LCG — aynı tohum, aynı patlama; göz kararı karşılaştırma stabil olur.
    let seed = 1234567;
    const rand = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;

    const c = document.createElement('canvas');
    const CSS = 320;
    c.style.width = `${CSS}px`;
    c.style.height = `${CSS}px`;
    c.style.background = '#F4F4F0';
    out.appendChild(c);
    const stage = syncStageCanvas(c);
    const { ctx, w, h, r } = stage;
    const dpr = c.width / w;
    const cx = w / 2;
    const cy = h / 2;

    drawAvatarStage(ctx, w, h, r, { color: '#2F6A4F', expression: 'FOCUS', facingAngle: 0.4 });
    const sparks = spawnBoingSparks(cx, cy, r, '#2F6A4F', rand);
    for (let t = 0; t < 0.3; t += 1 / 60) stepSparks(sparks, r, 1 / 60);
    const tBefore = ctx.getTransform();
    drawSparks(ctx, r, sparks);
    const tAfter = ctx.getTransform();
    const fmtT = (m) => [m.a, m.b, m.c, m.d, m.e, m.f].map((v) => +v.toFixed(3)).join(',');
    const sparkDump = sparks.map((p) => ({
      x: +p.x.toFixed(1),
      y: +p.y.toFixed(1),
      life: +p.life.toFixed(2),
      gold: p.color === '#FFD700',
    }));

    // Ölçüm: AYRI ŞEFFAF KATMANDA yalnız kıvılcımlar çizilir — altın
    // pikseller gövde yeşiliyle karışmadan sayılır. (Ana canvas'ta yarı
    // saydam altın, yeşil gövde üstünde zeytin rengine (151,160,40) döner ve
    // renk filtresi ıskalardı; bu yüzden katman şart.)
    const oc = document.createElement('canvas');
    oc.width = c.width;
    oc.height = c.height;
    const og = oc.getContext('2d');
    og.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawSparks(og, r, sparks);
    const img = og.getImageData(0, 0, oc.width, oc.height).data;
    const sx = cx * dpr;
    const sy = (cy - r * 0.23) * dpr; // doğuş merkezi
    let n = 0, sumX = 0, sumY = 0, left = 0, right = 0, alphaN = 0;
    const pxAt = (px, py) => {
      const xi = Math.max(0, Math.min(c.width - 1, Math.round(px)));
      const yi = Math.max(0, Math.min(c.height - 1, Math.round(py)));
      const o = (yi * c.width + xi) * 4;
      return [img[o], img[o + 1], img[o + 2], img[o + 3]].join(',');
    };
    for (let y = 0; y < oc.height; y += 1) {
      for (let x = 0; x < oc.width; x += 1) {
        const o = (y * oc.width + x) * 4;
        if (img[o + 3] >= 8) alphaN += 1;
        if (img[o + 3] < 8) continue;
        const R8 = img[o];
        const G8 = img[o + 1];
        const B8 = img[o + 2];
        if (!(R8 > 200 && G8 > 170 && B8 < 120)) continue; // yalnız altın kıvılcım
        n += 1;
        sumX += x;
        sumY += y;
        if (x < sx) left += 1; else right += 1;
      }
    }
    const report = {
      probeBuild: 7, // prob kodu değişince artır: bayat sayfa çalışıyorsa anlaşılsın
      devicePixelRatio: window.devicePixelRatio || 1,
      alphaPixels: alphaN,
      // Kıvılcım #9'un hesaplanan konumundaki gerçek piksel (ölçek dpr=1 varsayar).
      sampleAtSpark9: pxAt(sparks[9].x * dpr, sparks[9].y * dpr),
      sampleAtCenter: pxAt(sx, sy),
      canvasBitmap: [c.width, c.height],
      stageWH: [w, h],
      transformBeforeSparks: fmtT(tBefore),
      transformAfterSparks: fmtT(tAfter),
      sparkDump,
      sparkPixels: n,
      centroidDxCss: +(((sumX / Math.max(1, n)) - sx) / dpr).toFixed(2),
      centroidDyCss: +(((sumY / Math.max(1, n)) - sy) / dpr).toFixed(2),
      leftPixels: left,
      rightPixels: right,
      radiusCss: r,
    };
    // Referans artısı: tam doğuş merkezine kırmızı işaret + koordinat
    // çerçevesi (çerçeve canvas kenarına oturmuyorsa transform bozuktur).
    ctx.save();
    ctx.strokeStyle = '#FF0000';
    ctx.lineWidth = Math.max(1, 2 / dpr);
    ctx.strokeRect(1, 1, w - 2, h - 2);
    const m = r * 0.35;
    ctx.beginPath();
    ctx.moveTo(cx - m, cy - r * 0.23);
    ctx.lineTo(cx + m, cy - r * 0.23);
    ctx.moveTo(cx, cy - r * 0.23 - m);
    ctx.lineTo(cx, cy - r * 0.23 + m);
    ctx.stroke();
    ctx.restore();

    const pre = document.createElement('pre');
    pre.style.padding = '12px';
    pre.textContent = JSON.stringify(report, null, 1);
    out.appendChild(pre);
    document.title = 'probe sparks';
  }
} else {

const GAME = (params.get('game') || 'ARCHER').toUpperCase();
const TIME_MS = num('t', 2500);
const CELLS = num('cells', 1);
// Hücreyi görüntüye sığdır: 1920px'lik masaüstü hücresi 1440px'lik panelde
// kırpılıyordu, karşılaştırma yapılamıyordu. `fit` = panel genişliği / en geniş hücre.
const FIT = num('fit', 0);
const START_MATCH = num('match', 1);
const SEATS = num('seats', 2);

const SIZES = CELLS > 1
  ? [[1920, 1080], [852, 393], [1180, 820]]
  : [[num('w', 852), num('h', 393)]];


const { CARTRIDGES } = await import('../../src/core/engineRegistry.js');
const cartridge = CARTRIDGES[GAME];
if (!cartridge) throw new Error(`unknown game: ${GAME}`);
const GameClass = await cartridge.load();

const out = document.getElementById('out');
const reports = [];

for (const [w, h] of SIZES) {
  pinViewport(w, h);

  const canvas = document.createElement('canvas');
  const dpr = 1;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const game = new GameClass({ width: canvas.width, height: canvas.height, getContext: () => ctx });
  game.resize(w, h);
  game.slotTypes = Array.from({ length: 4 }, (_, i) => (
    i < SEATS ? 'human' : (i === SEATS && START_MATCH ? 'bot' : 'empty')
  ));
  // Koltuk başlatıcısı oyuna göre adlandırılmış: `initPlayers` (PONG, ARCHER,
  // HORDE, …) ya da `initTanks` (TANKS). Tek isim varsaymak bir oyunu
  // render-harness'ında sessizce düşürüyordu.
  const init = typeof game.initPlayers === 'function'
    ? game.initPlayers
    : (typeof game.initTanks === 'function' ? game.initTanks : null);
  if (init) init.call(game);
  if (START_MATCH) game.startNewMatch();
  game.lastTime = 1000;

  // Sabit adımla ilerlet: `update(now)` deterministik olsun.
  const stepMs = 16;
  for (let t = 0; t < TIME_MS; t += stepMs) game.update(1000 + t + stepMs);
  // `dry=1` oyuncuları cephanesiz bırakır: HORDE'un "OUT OF AMMO" rozetini
  // görebilmek için. Oyuncu girdi olmadan hiç ateş etmediği için bu durum
  // harness'te doğal olarak oluşmuyor.
  if (num('dry', 0) === 1) {
    for (const p of game.players || []) {
      if (Number.isFinite(p.magazine) && p.magazine > 0) p.ammo = 0;
    }
  }
  game.render();

  const wrap = document.createElement('div');
  wrap.className = 'row';
  const head = document.createElement('h2');
  head.textContent = `${GAME} — ${w}x${h} (dpr ${dpr})`;
  wrap.appendChild(head);
  if (FIT > 0 && FIT < 1) {
    // Görüntüye sığdır ama çizim dokunulmadan kalır: canvas'ın CSS boyutu
    // değişir, `width`/`height` backing store'u ve `resize()` girdisi değil.
    const frame = document.createElement('div');
    frame.style.width = `${w * FIT}px`;
    frame.style.height = `${h * FIT}px`;
    frame.style.overflow = 'hidden';
    canvas.style.transformOrigin = 'top left';
    canvas.style.transform = `scale(${FIT})`;
    frame.appendChild(canvas);
    wrap.appendChild(frame);
  } else {
    wrap.appendChild(canvas);
  }
  out.appendChild(wrap);

  const a = game.arena || {};
  const body = game.players?.[0]?.radius ?? null;
  reports.push({
    game: GAME,
    size: `${w}x${h}`,
    arena: a.width && a.height ? `${Math.round(a.width)}x${Math.round(a.height)}` : null,
    shortSide: a.size != null ? +a.size.toFixed(1) : null,
    insets: a.top != null ? +(a.top).toFixed(1) : null,
    playerRadius: body != null ? +body.toFixed(2) : null,
    bodyPct: a.size && body ? +((body * 2 / a.size) * 100).toFixed(2) : null,
    obstacles: game.obstacles?.length ?? game.pillars?.length ?? null,
  });
}

const meta = document.createElement('div');
meta.className = 'meta';
meta.textContent = JSON.stringify(reports);
out.appendChild(meta);
document.title = `harness ${GAME}`;
}
</script>
</body>
</html>
